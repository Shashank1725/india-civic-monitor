# Render Blueprint — India Civic Disruption Monitoring System
# Single free web service: FastAPI + built React frontend + SQLite snapshot restore.
services:
  - type: web
    name: india-civic-monitor
    runtime: python
    plan: free
    # Python version comes from the committed .python-version file (3.12),
    # because the pinned numpy/pandas wheels don't support Render's default 3.14.
    buildCommand: pip install -r requirements.txt && cd frontend && npm ci && npm run build
    startCommand: python -m uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./india_civic_monitor.db
      - key: DATASET_DIR
        value: ./Dataset
      - key: DEBUG
        value: "false"
      # Set these two in the Render dashboard AFTER uploading the snapshot
      # as a GitHub Release asset (see DEPLOY.md):
      - key: DB_SNAPSHOT_URL
        sync: false
      - key: DB_SNAPSHOT_SHA256
        sync: false
